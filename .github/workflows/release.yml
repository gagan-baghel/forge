# Ship a release — installed copies of Forge offer it as an in-app update:
#
#   pnpm release            (patch: 1.0.0 → 1.0.1; or pnpm release minor)
#
# Builds a universal (Intel + Apple Silicon) bundle and attaches it to a
# GitHub Release, so installing Forge is "download, drag, open" for someone
# who does not have Node, pnpm or Rust and never will. The release also
# carries a signed update archive and latest.json, which is what the app's
# updater reads (plugins.updater in tauri.conf.json).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  dmg:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Apple signing only when its secrets exist. An unset secret still
      # arrives as an empty variable, and the bundler then tries to import an
      # empty certificate and fails the whole build.
      - name: Use Apple signing if configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__END__"; echo "${!v}"; echo "__END__"; } >> "$GITHUB_ENV"
            fi
          done
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "No Apple certificate: building unsigned."; fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update archive. Installed apps refuse any update that
          # isn't signed with this key, so a forged release can't install.
          # Without the secret the build fails rather than ship unsigned updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Apple signing variables, when configured, come from the step above.
          # The DMG bundler's cosmetic icon-positioning step drives Finder over
          # AppleScript and fails on a headless runner. Same DMG without it.
          CI: true
        with:
          # Update archives are signed only here: a local build has no key and
          # shouldn't need one.
          args: --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":true}}'
          tagName: ${{ github.ref_name }}
          releaseName: Forge ${{ github.ref_name }}
          releaseDraft: false
          # latest.json is the update feed installed apps poll.
          includeUpdaterJson: true
