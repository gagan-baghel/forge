# Checks every push and pull request: the same gates as the pre-commit hook,
# plus the full test suites and the Rust side. Releases (release.yml) only
# run on tags, so without this a broken main went unnoticed until shipping.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint --max-warnings=0
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm vite build

  # Linux, not macOS: macOS runners are capacity-limited and a queued job was
  # cancelled after 15 minutes without ever starting. Nothing here needs a Mac
  # (the macOS bundle is built by release.yml), only Tauri's Linux libraries.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri's build script embeds the frontend; an empty dist is enough to compile.
      - run: mkdir -p ../dist
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
